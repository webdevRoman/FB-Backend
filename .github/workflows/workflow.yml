name: workflow.yml

on:
  push:
    branches: [ master, develop, 'rc/**' ]
  pull_request:
    branches: [ master, develop, 'rc/**' ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test

  tests:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Generate test report with JaCoCo
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: Verify test coverage with JaCoCo
        run: ./gradlew jacocoTestCoverageVerification

  publication:
    runs-on: ubuntu-24.04
    needs: tests
    permissions:
      contents: read
      packages: write
    outputs:
      published_image: ${{ steps.push.outputs.published_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calculate image name and tag based on run number and short git commit SHA
        run: |
          runNumber=${{ github.run_number }}
          shortSha=$(git rev-parse --short ${{ github.sha }})
          image="fb-lb:${runNumber}-${shortSha}"
          image_st="fb-lb-st:${runNumber}-${shortSha}"
          echo "IMAGE=$image" >> $GITHUB_ENV
          echo "IMAGE_ST=$image_st" >> $GITHUB_ENV

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publication and with layers caching
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner to generate txt report
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: 'image'
          scan-ref: ${{ env.IMAGE }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          format: 'table'
          output: trivy.txt

      - name: Upload Trivy txt report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy.txt

      - name: Run Trivy vulnerability scanner to check quality gate
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: 'image'
          scan-ref: ${{ env.IMAGE }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy vulnerability scanner to generate SBOM CycloneDX report
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: 'image'
          scan-ref: ${{ env.IMAGE }}
          hide-progress: true
          format: 'cyclonedx'
          output: sbom-cyclonedx.json

      - name: Upload Trivy SBOM CycloneDX report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-report
          path: sbom-cyclonedx.json

      - name: Log in to Docker Registry
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to Docker Registry
        id: push
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag ${{ env.IMAGE }} ghcr.io/webdevroman/${{ env.IMAGE }}
          docker push ghcr.io/webdevroman/${{ env.IMAGE }}
          echo "published_image=ghcr.io/webdevroman/${{ env.IMAGE }}" >> "$GITHUB_OUTPUT"

  staging:
    name: Copy image to staging
    runs-on: ubuntu-24.04
    needs: [ build, tests, publication ]
    if: >-
      github.ref == 'refs/heads/develop'
      && needs.build.result == 'success'
      && needs.tests.result == 'success'
      && needs.publication.result == 'success'
      && needs.publication.outputs.published_image != ''
    permissions:
      contents: read
      packages: write
    outputs:
      staging_image: ${{ steps.copy.outputs.staging_image }}
    env:
      REGISTRY: ghcr.io
      SOURCE_IMAGE: ${{ needs.publication.outputs.published_image }}
      STAGING_IMAGE: ${{ needs.publication.outputs.published_image }}-staging

    steps:
      - name: Show source and staging image references
        run: |
          echo "Source : $SOURCE_IMAGE"
          echo "Staging: $STAGING_IMAGE"

      - name: Log in to Docker Registry with skopeo
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | skopeo login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Copy image to staging tag with skopeo
        id: copy
        run: |
          skopeo copy "docker://$SOURCE_IMAGE" "docker://$STAGING_IMAGE"
          echo "staging_image=$STAGING_IMAGE" >> "$GITHUB_OUTPUT"

  update-manifest:
    name: Update image tag in staging manifest
    runs-on: ubuntu-24.04
    needs: [ staging ]
    if: >-
      github.ref == 'refs/heads/develop'
      && needs.staging.result == 'success'
      && needs.staging.outputs.staging_image != ''
    permissions:
      contents: write
    env:
      MANIFEST: k8s-manifests/staging/deployment.yaml
      STAGING_IMAGE: ${{ needs.staging.outputs.staging_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yq
        run: |
          if ! command -v yq > /dev/null 2>&1; then
            sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Show the image reference before the update
        run: |
          echo "Manifest:  $MANIFEST"
          echo "Old image: $(yq '.spec.template.spec.containers[0].image' "$MANIFEST")"
          echo "New image: $STAGING_IMAGE"

      - name: Update the image in the manifest
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(STAGING_IMAGE)' "$MANIFEST"
          updated=$(yq '.spec.template.spec.containers[0].image' "$MANIFEST")
          if [ "$updated" != "$STAGING_IMAGE" ]; then
            echo "::error::Manifest still points to '$updated' instead of '$STAGING_IMAGE'"
            exit 1
          fi

      - name: Commit and push the manifest
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "::error::$MANIFEST was not changed, nothing to commit"
            exit 1
          fi
          git diff --cached
          git commit -m "Deploy $STAGING_IMAGE to staging"
          git push
